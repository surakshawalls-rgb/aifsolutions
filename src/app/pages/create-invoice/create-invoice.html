<h2>Create Invoice</h2>

<p><strong>Invoice No:</strong> {{ invoiceNo }}</p>

<table border="1" width="100%">
  <tr>
    <th>S.No</th>
    <th>Particulars</th>
    <th>HSN</th>
    <th>Qty</th>
    <th>Rate</th>
    <th>Amount</th>
  </tr>

  <tr *ngFor="let item of items; let i = index">
    <td>{{ i + 1 }}</td>
    <td><input [(ngModel)]="item.name"></td>
    <td><input [(ngModel)]="item.hsn"></td>
    <td><input type="number" [(ngModel)]="item.qty"></td>
    <td><input type="number" [(ngModel)]="item.rate"></td>
    <td>{{ item.qty * item.rate }}</td>
  </tr>
</table>

<br>
<button (click)="addItem()">+ Add Item</button>

<hr>

<p>Sub Total: {{ subTotal }}</p>

<label>
  GST Type:
  <select [(ngModel)]="gstType">
    <option value="IGST">IGST 18%</option>
    <option value="CGST">CGST 9% + SGST 9%</option>
  </select>
</label>

<p *ngIf="gstType === 'IGST'">
  IGST 18%: {{ gstAmount }}
</p>

<p *ngIf="gstType === 'CGST'">
  CGST 9%: {{ gstAmount / 2 }} <br>
  SGST 9%: {{ gstAmount / 2 }}
</p>

<p>
  Other Charges:
  <input type="number" [(ngModel)]="otherCharges">
</p>

<h3>Grand Total: {{ grandTotal }}</h3>
