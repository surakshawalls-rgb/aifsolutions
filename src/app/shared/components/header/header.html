<header class="header" [class.scrolled]="isScrolled()" [class.menu-open]="isMenuOpen()">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container top-bar-content">
      <div class="contact-info">
        <a [href]="getPhoneUrl()" class="contact-item" aria-label="Call us">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          <span>{{ getPhone() }}</span>
        </a>
        <a [href]="getWhatsAppUrl()" class="contact-item whatsapp" aria-label="WhatsApp us" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.673m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378 3.43 3.43 0 0 1-.372-.224 4.07 4.07 0 0 1-.124-.372c0-.174-.025-.349-.1-.524a3.288 3.288 0 0 1 0-.299c.149-.373.767-.992 1.24-1.167.373-.124.67-.174 2.345-.174 1.142 0 1.83.1 2.413.373.757.349 1.38 1.1 1.553 1.778.173.673.124 1.168-.05 1.615-.124.323-.373.62-.748.942-.497.422-1.984 1.93-2.58 2.328-.373.249-.748.373-1.293.373-.223 0-.447-.026-.67-.075z"/>
          </svg>
          <span>WhatsApp</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Main Navigation -->
  <nav class="main-nav" aria-label="Main navigation">
    <div class="container nav-content">
      <!-- Logo -->
      <a routerLink="/home" class="logo" aria-label="{{ getCompanyName() }} - Home">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-name">{{ getCompanyName() }}</span>
          <span class="logo-tagline">{{ getTagline() }}</span>
        </div>
      </a>

      <!-- Desktop Navigation -->
      <div class="nav-links desktop-nav">
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
            {{ link.label }}
          </a>
        }
      </div>

      <!-- CTA Buttons -->
      <div class="nav-cta desktop-cta">
        <a routerLink="/contact-us" class="btn btn-outline">Contact Us</a>
        <a routerLink="/enquiry" class="btn btn-primary">Get a Quote</a>
      </div>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()" aria-controls="mobile-menu" aria-label="Toggle navigation menu">
        @if (!isMenuOpen()) {
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        } @else {
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        }
      </button>
    </div>

    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="mobile-nav" [class.open]="isMenuOpen()" role="navigation" aria-label="Mobile navigation">
      <div class="mobile-nav-content">
        <div class="mobile-nav-links">
          @for (link of navLinks; track link.path) {
            <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="mobile-nav-link" (click)="closeMenu()">
              {{ link.label }}
            </a>
          }
        </div>
        <div class="mobile-nav-cta">
          <a routerLink="/contact-us" class="btn btn-outline btn-full" (click)="closeMenu()">Contact Us</a>
          <a routerLink="/enquiry" class="btn btn-primary btn-full" (click)="closeMenu()">Get a Quote</a>
          <a [href]="getWhatsAppUrl()" class="btn btn-whatsapp btn-full" target="_blank" rel="noopener" (click)="closeMenu()">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.673m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378 3.43 3.43 0 0 1-.372-.224 4.07 4.07 0 0 1-.124-.372c0-.174-.025-.349-.1-.524a3.288 3.288 0 0 1 0-.299c.149-.373.767-.992 1.24-1.167.373-.124.67-.174 2.345-.174 1.142 0 1.83.1 2.413.373.757.349 1.38 1.1 1.553 1.778.173.673.124 1.168-.05 1.615-.124.323-.373.62-.748.942-.497.422-1.984 1.93-2.58 2.328-.373.249-.748.373-1.293.373-.223 0-.447-.026-.67-.075z"/>
            </svg>
            WhatsApp Us
          </a>
        </div>
        <div class="mobile-contact">
          <a [href]="getPhoneUrl()" class="mobile-contact-item">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <span>{{ getPhone() }}</span>
          </a>
        </div>
      </div>
    </div>
  </nav>
</header>
