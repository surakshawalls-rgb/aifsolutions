<div class="contact-info-section">
  <h3 class="contact-section-title">Contact Information</h3>
  <div class="contact-grid">
    <div class="contact-card">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </div>
      <div class="contact-details">
        <h4>Address</h4>
        <address>
          <a [href]="'https://maps.google.com/?q=' + encodeURIComponent(getAddress())" target="_blank" rel="noopener" class="contact-link">
            {{ getAddress() }}
          </a>
        </address>
      </div>
    </div>

    <div class="contact-card">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </div>
      <div class="contact-details">
        <h4>Email</h4>
        <a [href]="getEmailUrl()" class="contact-link">{{ getEmail() }}</a>
      </div>
    </div>

    @for (phone of getPhones(); track phone) {
      <div class="contact-card">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </div>
        <div class="contact-details">
          <h4>Phone</h4>
          <a [href]="getPhoneUrl(phone)" class="contact-link">{{ phone }}</a>
        </div>
      </div>
    }

    <div class="contact-card">
      <div class="contact-icon whatsapp">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.673m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378 3.43 3.43 0 0 1-.372-.224 4.07 4.07 0 0 1-.124-.372c0-.174-.025-.349-.1-.524a3.288 3.288 0 0 1 0-.299c.149-.373.767-.992 1.24-1.167.373-.124.67-.174 2.345-.174 1.142 0 1.83.1 2.413.373.757.349 1.38 1.1 1.553 1.778.173.673.124 1.168-.05 1.615-.124.323-.373.62-.748.942-.497.422-1.984 1.93-2.58 2.328-.373.249-.748.373-1.293.373-.223 0-.447-.026-.67-.075z"/>
        </svg>
      </div>
      <div class="contact-details">
        <h4>WhatsApp</h4>
        <a [href]="getWhatsAppUrl()" class="contact-link whatsapp-link" target="_blank" rel="noopener">Chat with us</a>
      </div>
    </div>

    <div class="contact-card">
      <div class="contact-icon youtube">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
      </div>
      <div class="contact-details">
        <h4>YouTube</h4>
        <a [href]="getYouTube()" class="contact-link youtube-link" target="_blank" rel="noopener">Watch our videos</a>
      </div>
    </div>
  </div>
</div>
