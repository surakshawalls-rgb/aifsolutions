<article class="product-card card">
  <a [routerLink]="['/collections-products', product().id]" class="card-link" aria-label="View {{ product().name }} details">
    <div class="card-image-wrapper">
      <img
        [src]="product().imageUrl"
        [alt]="product().name"
        class="card-image"
        loading="lazy"
        width="400"
        height="250"
      />
      <div class="card-category">{{ product().category }}</div>
    </div>
    <div class="card-content">
      <h3 class="card-title">{{ product().name }}</h3>
      <p class="card-text">{{ product().shortDescription }}</p>
    </div>
  </a>
  <div class="card-actions">
    <a [routerLink]="['/collections-products', product().id]" class="btn btn-outline btn-sm" aria-label="View details for {{ product().name }}">
      View Details
    </a>
    @if (showEnquireButton()) {
      <a [routerLink]="['/enquiry']" [queryParams]="{product: product().id, type: 'product-enquiry'}" class="btn btn-primary btn-sm" aria-label="Enquire about {{ product().name }}">
        Enquire Now
      </a>
    }
  </div>
</article>
